# Builds the static site and publishes the ready-to-serve files to the `site` branch.
# The server never needs Node.js: it only pulls `site` (see DEPLOY.md).
name: Build static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Publish out/ to the site branch
        run: |
          mkdir -p out/.deploy
          cp deploy/nginx.conf deploy/update-site.sh DEPLOY.md out/.deploy/
          cd out
          touch .nojekyll
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" site

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 14
