# nginx site for "ритм" — a fully static build, no Node.js on the server.
# Install: copy to /etc/nginx/sites-available/ritm, link into sites-enabled,
# set server_name and root, then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name example.com;              # ← your domain or the server IP

    root /var/www/ritm;                   # ← folder with the built site (contents of out/)
    index index.html;
    charset utf-8;

    # Note: add_header inside a location replaces the server-level ones,
    # so every location lists its headers in full.

    # Pages are exported as /ru/code.html etc.; serve them at /ru/code.
    # HTML is revalidated on every visit so a new deploy shows up at once.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Hashed build assets never change: browsers may keep them for a year.
    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The site folder is a git checkout: never serve .git or other dot-files.
    location ~ /\. {
        return 404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json text/plain image/svg+xml;
}
